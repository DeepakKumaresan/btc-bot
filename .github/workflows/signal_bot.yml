name: ETH APEX Signal Bot — 24/7 Scanner

on:
  push:
    branches: [master]        # Triggers immediately on every push
  schedule:
    - cron: "*/15 * * * *"   # Every 15 minutes, 96 scans/day
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  scan:
    name: "ETH Signal Scan (Bitget — Multi-Coin)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-apex-v5-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-apex-v5-

      - name: Install dependencies
        run: pip install --upgrade pip ccxt pandas numpy ta requests scikit-learn

      - name: Restore signal log (prevent duplicate signals)
        uses: actions/cache@v4
        with:
          path: signals_log.json
          key: signals-log-${{ github.run_number }}
          restore-keys: signals-log-

      - name: Run ETH APEX scan (6 coins — DOGE/XRP/ADA/TRX/SOL/ETH)
        env:
          TG_TOKEN: "8775276870:AAGABvQ6PwtRgGPNbk3V4YX_A0eVXxpiWyo"
          TG_CHAT: "998659643"
        run: python -u btc_apex_v5.py --cron

      - name: Keep Render alive
        run: curl -s --max-time 10 https://btc-signal-bot-v3.onrender.com/ || true
        continue-on-error: true
