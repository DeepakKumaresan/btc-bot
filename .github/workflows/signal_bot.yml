name: BTC APEX Signal Bot — 24/7 Keep-Alive & Scan Trigger

on:
  schedule:
    - cron: "*/10 * * * *"   # Every 10 minutes, 24/7 (keeps Render from sleeping)
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  ping:
    name: "Trigger Market Scan & Keep-Alive"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Ping to Frankfurt Render Bot
        run: |
          echo "Sending scan trigger request to https://btc-signal-bot-v3.onrender.com/scan"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://btc-signal-bot-v3.onrender.com/scan)
          
          # Extract body and status
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          STATUS=$(echo "$RESPONSE" | tr -d '\r' | grep 'HTTP_STATUS' | cut -d':' -f2)
          
          echo "Response Body: $BODY"
          echo "HTTP Status: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "Error: Server returned status $STATUS"
            exit 1
          fi
          echo "Scan successfully triggered!"
