name: BTC APEX Signal Bot — 24/7 Free

on:
  schedule:
    - cron: "*/15 * * * *"   # Every 15 minutes, 24/7, 96 scans/day
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  scan:
    name: "BTC Signal Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-v2-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ccxt pandas numpy ta requests

      - name: Restore signal log from previous run
        uses: actions/cache@v4
        with:
          path: signals_log.json
          key: signals-log-${{ github.run_number }}
          restore-keys: signals-log-

      - name: Run BTC APEX scan
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN != '' && secrets.TG_TOKEN || '8775276870:AAGABvQ6PwtRgGPNbk3V4YX_A0eVXxpiWyo' }}
          TG_CHAT:  ${{ secrets.TG_CHAT  != '' && secrets.TG_CHAT  || '998659643' }}
        run: python -u btc_apex_v5.py --cron
